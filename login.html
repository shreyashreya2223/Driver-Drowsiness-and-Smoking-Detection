<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Driver Monitor - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #38bdf8;
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
        }

        .login-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e2e8f0;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.8);
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            transform: translateY(-2px);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .credentials-box {
            background: rgba(22, 163, 74, 0.1);
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .credentials-label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .credential-item {
            margin-bottom: 15px;
        }

        .credential-item:last-child {
            margin-bottom: 0;
        }

        .credential-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .credential-value {
            font-size: 16px;
            font-weight: bold;
            color: #22c55e;
            background: rgba(22, 163, 74, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-title">AI DRIVER MONITOR</div>
        <div class="login-subtitle">Real-Time Driver Safety System</div>

        {% if error %}
        <div class="error-message show">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">LOGIN</button>
        </form>

        <div class="credentials-box">
            <div class="credentials-label">Demo Credentials</div>
            
            <div class="credential-item">
                <div class="credential-label">Username:</div>
                <div class="credential-value">admin</div>
            </div>

            <div class="credential-item">
                <div class="credential-label">Password:</div>
                <div class="credential-value">driver123</div>
            </div>
        </div>

        <div class="footer">
            Developed as Major Project • IILM University
        </div>
    </div>
</body>
</html>
